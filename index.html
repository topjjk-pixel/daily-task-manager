<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일일 업무관리</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173c75;color:white;padding:22px;text-align:center}main{max-width:1180px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce4ec;border-radius:12px;padding:20px;margin-bottom:18px}h1{margin:0;font-size:26px}h2{font-size:19px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-weight:600;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:70px}button{border:0;border-radius:7px;padding:10px 15px;background:#2259a8;color:white;cursor:pointer;font-weight:700}button.secondary{background:#64748b}button.danger{background:#b91c1c}button:disabled{opacity:.5}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:16px;background:#e8f0fb;border-radius:10px;flex:1;min-width:130px}.stat strong{display:block;font-size:25px}.table{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:13px}th{background:#edf4fc}#message{min-height:20px;color:#1d4ed8}.muted{color:#64748b;font-size:13px}.hide{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}header{padding:15px}h1{font-size:21px}}@media print{header,.no-print,#loginCard,#formCard,button{display:none!important}body{background:white}.card{border:0}table{min-width:0}main{max-width:none}}
</style></head><body><header><h1>공동 일일 업무관리</h1><div>Supabase 연동 · 부서 공동 업무 현황</div></header><main>
<section class="card" id="loginCard"><h2>직원 로그인</h2><div class="grid"><label>이메일<input id="email" type="email" autocomplete="username"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label></div><div class="buttons"><button id="login">로그인</button><button id="signup" class="secondary">계정 등록</button><button id="logout" class="danger hide">로그아웃</button></div><p class="muted">승인된 직원 계정만 이용하세요. 자체 회원가입은 Supabase 인증 설정에 따라 제한될 수 있습니다.</p></section>
<div id="workspace" class="hide"><section class="card"><div class="stats"><div class="stat">전체 업무<strong id="total">0</strong></div><div class="stat">완료 업무<strong id="completed">0</strong></div><div class="stat">완료율<strong id="rate">0%</strong></div></div></section>
<section class="card" id="formCard"><h2 id="formTitle">업무 등록</h2><form id="taskForm"><div class="grid">
<label>업무명 *<input id="task_name" maxlength="180" required></label><label>담당자 *<input id="assignee" maxlength="100" required></label>
<label>중요도 *<select id="priority"><option value="high">높음</option><option value="medium" selected>보통</option><option value="low">낮음</option></select></label>
<label>마감일 *<input id="due_date" type="date" required></label>
<label>진행 상태 *<select id="status"><option value="scheduled">예정</option><option value="in_progress">진행 중</option><option value="completed">완료</option></select></label>
<label>비고<textarea id="notes" maxlength="2000"></textarea></label></div><div class="buttons"><button type="submit">저장</button><button type="button" id="clear" class="secondary">입력 초기화</button></div></form></section>
<section class="card"><h2>공동 업무 목록</h2><div class="grid no-print"><label>중요도 필터<select id="filterPriority"><option value="">전체</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></label><label>상태 필터<select id="filterStatus"><option value="">전체</option><option value="scheduled">예정</option><option value="in_progress">진행 중</option><option value="completed">완료</option></select></label></div><div class="buttons no-print"><button id="refresh">새로고침</button><button id="print" class="secondary">인쇄 / PDF</button></div><p class="muted">업무를 등록한 사용자만 해당 업무를 수정·삭제할 수 있습니다. 완료율은 필터 이전의 전체 업무 기준입니다.</p><div class="table"><table><thead><tr><th>업무명</th><th>담당자</th><th>중요도</th><th>마감일</th><th>상태</th><th>비고</th><th class="no-print">관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><p id="message" role="status"></p></main>
<script>
const URL_BASE='https://zaebytbxznokksgzegzp.supabase.co',API_KEY='sb_publishable_Iqg5TUCFAdTE4_CywZZlXQ_fwEqTo0H';
const $=id=>document.getElementById(id);
let token='',uid='',records=[],editing=null;
const names={high:'높음',medium:'보통',low:'낮음',scheduled:'예정',in_progress:'진행 중',completed:'완료'};
function msg(s){$('message').textContent=s}
async function api(path,method='GET',body=null){const r=await fetch(URL_BASE+path,{method,headers:{apikey:API_KEY,Authorization:'Bearer '+(token||API_KEY),'Content-Type':'application/json',Prefer:'return=representation'},body:body===null?undefined:JSON.stringify(body)});if(!r.ok){let e=await r.text();throw Error(e.slice(0,300))}if(r.status===204)return null;const t=await r.text();return t?JSON.parse(t):null}
async function auth(action){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('이메일과 비밀번호를 입력해 주세요.');try{const data=await api('/auth/v1/'+(action==='signup'?'signup':'token?grant_type=password'),'POST',{email,password});if(data.access_token){token=data.access_token;uid=data.user.id;sessionStorage.setItem('session',JSON.stringify({token,uid}));showUser();await load()}else msg('등록 요청을 접수했습니다. 이메일 인증 및 관리자 승인을 확인하세요.')}catch(e){msg('인증 오류: '+e.message)}}
function showUser(){$('workspace').classList.toggle('hide',!token);$('logout').classList.toggle('hide',!token);$('login').classList.toggle('hide',!!token);$('signup').classList.toggle('hide',!!token);$('email').disabled=!!token;$('password').disabled=!!token}
async function load(){try{const a=await api('/rest/v1/daily_tasks?select=*&order=created_at.desc');records=a||[];render();msg('업무 목록을 불러왔습니다.')}catch(e){if(e.message.includes('JWT'))logout();msg('조회 오류: '+e.message)}}
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td)}
function render(){const all=records,done=all.filter(x=>x.status==='completed').length;$('total').textContent=all.length;$('completed').textContent=done;$('rate').textContent=all.length?Math.round(done/all.length*100)+'%':'0%';const p=$('filterPriority').value,s=$('filterStatus').value;const body=$('rows');body.replaceChildren();all.filter(x=>(!p||x.priority===p)&&(!s||x.status===s)).forEach(x=>{const tr=document.createElement('tr');[x.task_name,x.assignee,names[x.priority]||x.priority,x.due_date,names[x.status]||x.status,x.notes||''].forEach(v=>cell(tr,v));const td=document.createElement('td');td.className='no-print';if(x.created_by===uid){const b=document.createElement('button');b.textContent='수정';b.onclick=()=>edit(x.id);const d=document.createElement('button');d.textContent='삭제';d.className='danger';d.onclick=()=>removeTask(x.id);td.append(b,' ',d)}else td.textContent='조회 전용';tr.append(td);body.append(tr)});if(!body.children.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.textContent='표시할 업무가 없습니다.';tr.append(td);body.append(tr)}}
function reset(){editing=null;$('taskForm').reset();$('formTitle').textContent='업무 등록'}
function edit(id){const x=records.find(z=>z.id===id);if(!x||x.created_by!==uid)return;editing=id;['task_name','assignee','priority','due_date','status','notes'].forEach(k=>$(k).value=x[k]||'');$('formTitle').textContent='업무 수정';$('formCard').scrollIntoView({behavior:'smooth'})}
async function removeTask(id){const x=records.find(z=>z.id===id);if(!x||x.created_by!==uid)return;if(!confirm('이 업무를 삭제하시겠습니까?'))return;try{await api('/rest/v1/daily_tasks?id=eq.'+encodeURIComponent(id),'DELETE');await load()}catch(e){msg('삭제 오류: '+e.message)}}
$('taskForm').onsubmit=async e=>{e.preventDefault();if(!$('taskForm').reportValidity())return;const b={};['task_name','assignee','priority','due_date','status','notes'].forEach(k=>b[k]=$(k).value.trim());if(!b.task_name||!b.assignee||!b.due_date)return msg('필수 항목을 입력해 주세요.');try{if(editing)await api('/rest/v1/daily_tasks?id=eq.'+encodeURIComponent(editing),'PATCH',b);else await api('/rest/v1/daily_tasks','POST',b);reset();await load()}catch(e){msg('저장 오류: '+e.message)}};
function logout(){token='';uid='';records=[];sessionStorage.removeItem('session');showUser();reset();msg('로그아웃했습니다.')}
$('login').onclick=()=>auth('login');$('signup').onclick=()=>auth('signup');$('logout').onclick=logout;$('refresh').onclick=load;$('print').onclick=()=>window.print();$('clear').onclick=reset;$('filterPriority').onchange=render;$('filterStatus').onchange=render;
try{const s=JSON.parse(sessionStorage.getItem('session')||'null');if(s?.token&&s?.uid){token=s.token;uid=s.uid;showUser();load()}}catch{}
</script></body></html>
