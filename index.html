<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일일 업무관리</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173c75;color:white;padding:22px;text-align:center}main{max-width:1180px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce4ec;border-radius:12px;padding:20px;margin-bottom:18px}h1{margin:0;font-size:26px}h2{font-size:19px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-weight:600;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:70px}button{border:0;border-radius:7px;padding:10px 15px;background:#2259a8;color:white;cursor:pointer;font-weight:700}button.secondary{background:#64748b}button.danger{background:#b91c1c}button:disabled{opacity:.5}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:16px;background:#e8f0fb;border-radius:10px;flex:1;min-width:130px}.stat strong{display:block;font-size:25px}.table{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:13px}th{background:#edf4fc}#message{min-height:20px;color:#1d4ed8}.muted{color:#64748b;font-size:13px}.hide{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}header{padding:15px}h1{font-size:21px}}@media print{header,.no-print,#loginCard,#formCard,button{display:none!important}body{background:white}.card{border:0}table{min-width:0}main{max-width:none}}
</style></head><body><header><h1>공동 일일 업무관리</h1><div>공동 데이터 저장 · 로그인 불필요</div></header><main>
<section class="card"><b>로그인 없이 누구나 이용할 수 있습니다.</b><p>공개 공동 목록이므로 기밀정보·개인정보를 입력하지 마세요. 등록 브라우저에서만 수정·삭제할 수 있습니다.</p></section><div id="workspace"><section class="card"><div class="stats"><div class="stat">전체 업무<strong id="total">0</strong></div><div class="stat">완료 업무<strong id="completed">0</strong></div><div class="stat">완료율<strong id="rate">0%</strong></div></div></section>
<section class="card" id="formCard"><h2 id="formTitle">업무 등록</h2><form id="taskForm"><div class="grid">
<label>업무명 *<input id="task_name" maxlength="180" required></label><label>담당자 *<input id="assignee" maxlength="100" required></label>
<label>중요도 *<select id="priority"><option value="high">높음</option><option value="medium" selected>보통</option><option value="low">낮음</option></select></label>
<label>마감일 *<input id="due_date" type="date" required></label>
<label>진행 상태 *<select id="status"><option value="scheduled">예정</option><option value="in_progress">진행 중</option><option value="completed">완료</option></select></label>
<label>비고<textarea id="notes" maxlength="2000"></textarea></label></div><div class="buttons"><button type="submit">저장</button><button type="button" id="clear" class="secondary">입력 초기화</button></div></form></section>
<section class="card"><h2>공동 업무 목록</h2><div class="grid no-print"><label>중요도 필터<select id="filterPriority"><option value="">전체</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></label><label>상태 필터<select id="filterStatus"><option value="">전체</option><option value="scheduled">예정</option><option value="in_progress">진행 중</option><option value="completed">완료</option></select></label></div><div class="buttons no-print"><button id="refresh">새로고침</button><button id="print" class="secondary">인쇄 / PDF</button></div><p class="muted">업무를 등록한 사용자만 해당 업무를 수정·삭제할 수 있습니다. 완료율은 필터 이전의 전체 업무 기준입니다.</p><div class="table"><table><thead><tr><th>업무명</th><th>담당자</th><th>중요도</th><th>마감일</th><th>상태</th><th>비고</th><th class="no-print">관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><p id="message" role="status"></p></main>
<script>const B='https://zaebytbxznokksgzegzp.supabase.co',K='sb_publishable_Iqg5TUCFAdTE4_CywZZlXQ_fwEqTo0H',E=id=>document.getElementById(id);let tasks=[],editing=null,keys=JSON.parse(localStorage.getItem('dt_keys')||'{}');const dict={high:'높음',medium:'보통',low:'낮음',scheduled:'예정',in_progress:'진행 중',completed:'완료'};async function req(path,method='GET',body){let r=await fetch(B+'/rest/v1/'+path,{method,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.message);return d}function say(x){E('message').textContent=x}async function load(){try{tasks=await req('daily_tasks?select=id,task_name,assignee,priority,due_date,status,notes,created_at&order=created_at.desc');draw()}catch(e){say(e.message)}}function draw(){let done=tasks.filter(t=>t.status==='completed').length;E('total').textContent=tasks.length;E('completed').textContent=done;E('rate').textContent=tasks.length?Math.round(done/tasks.length*100)+'%':'0%';E('rows').replaceChildren();tasks.filter(t=>(!E('filterPriority').value||t.priority===E('filterPriority').value)&&(!E('filterStatus').value||t.status===E('filterStatus').value)).forEach(t=>{let tr=document.createElement('tr');[t.task_name,t.assignee,dict[t.priority],t.due_date,dict[t.status],t.notes].forEach(v=>{let td=document.createElement('td');td.textContent=v||'';tr.append(td)});let td=document.createElement('td');if(keys[t.id]){for(let [label,fn] of [['수정',()=>edit(t)],['삭제',()=>del(t.id)]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;td.append(b)}}else td.textContent='읽기 전용';tr.append(td);E('rows').append(tr)})}function edit(t){editing=t.id;for(let k of ['task_name','assignee','priority','due_date','status','notes'])E(k).value=t[k];E('formTitle').textContent='업무 수정';E('formCard').scrollIntoView()}function reset(){editing=null;E('taskForm').reset();E('formTitle').textContent='업무 등록'}async function del(id){if(!confirm('삭제할까요?'))return;try{await req('rpc/task_remove','POST',{p_id:id,p_token:keys[id]});delete keys[id];localStorage.setItem('dt_keys',JSON.stringify(keys));load()}catch(e){say(e.message)}}E('taskForm').onsubmit=async ev=>{ev.preventDefault();let b={p_name:E('task_name').value.trim(),p_assignee:E('assignee').value.trim(),p_priority:E('priority').value,p_due_date:E('due_date').value,p_status:E('status').value,p_notes:E('notes').value};if(!b.p_name||!b.p_assignee||!b.p_due_date)return say('필수 정보를 입력하세요');try{if(editing)await req('rpc/task_modify','POST',{p_id:editing,p_token:keys[editing],...b});else{let t=await req('rpc/task_create','POST',b);keys[t.id]=t.edit_token;localStorage.setItem('dt_keys',JSON.stringify(keys))}reset();load()}catch(e){say(e.message)}};E('clear').onclick=reset;E('refresh').onclick=load;E('print').onclick=()=>print();E('filterPriority').onchange=draw;E('filterStatus').onchange=draw;load();</script></body></html>
